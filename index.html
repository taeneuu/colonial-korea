<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>독립운동, 시대와 공간을 걷다</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-color: #1a365d;
            --accent-color: #c53030;
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --border-color: #e2d9c2;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header span {
            font-size: 0.9rem;
            color: #718096;
            letter-spacing: 1px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin: 10px 0;
        }

        header p {
            color: #4a5568;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* 검색창 및 돋보기 아이콘 수정 부분 */
        .search-container {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .search-container input {
            width: 100%;
            padding: 12px 40px 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .search-container .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            color: #a0aec0;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0; /* 불필요한 마진 제거로 붕 뜨는 현상 방지 */
        }

        /* 미주 지도 모바일 크기 최적화 부분 */
        .us-map-container {
            width: 100%;
            max-width: 300px; /* 모바일에서 너무 크지 않도록 제한 */
            height: 200px;
            margin: 15px auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        @media (max-width: 480px) {
            .us-map-container {
                max-width: 100%;
                height: 180px;
            }
        }

        /* 기타 기본 레이아웃 스타일 유지 */
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background-color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .map-section {
            width: 100%;
            height: 400px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <span>[ 한국사 인터랙티브 ] 1910S － 1940S</span>
            <h1>독립운동, 시대와 공간을 걷다</h1>
            <p>지도에서 단체를 클릭하면 상세 사료 및 활동 정보 팝업을 확인할 수 있습니다.</p>
        </header>

        <!-- 검색창 영역 (돋보기 아이콘 간격 문제 해결 적용) -->
        <div class="search-container">
            <input type="text" placeholder="단체명, 인물(예: 안창호, 재미한족연합) 검색...">
            <span class="search-icon">🔍</span>
        </div>

        <!-- 필터 버튼 영역 -->
        <div class="filter-buttons">
            <button class="filter-btn active">전체</button>
            <button class="filter-btn">무장 투쟁</button>
            <button class="filter-btn">의열 투쟁</button>
            <button class="filter-btn">실력 양성</button>
            <button class="filter-btn">비밀 결사</button>
            <button class="filter-btn">민족 협동 전선</button>
            <button class="filter-btn">정부/연합체</button>
        </div>

        <!-- 메인 지도 영역 -->
        <div id="map" class="map-section"></div>

        <!-- 미주 지도 예시 영역 (크기 최적화 적용) -->
        <div style="text-align: center; margin-top: 20px;">
            <h3>미주 지역 활동 지도</h3>
            <div id="us-map" class="us-map-container"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 기본 지도 초기화
        const map = L.map('map').setView([37.5665, 126.9780], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 미주 지도 초기화
        const usMap = L.map('us-map').setView([34.0522, -118.2437], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(usMap);
    </script>
</body>
</html>
